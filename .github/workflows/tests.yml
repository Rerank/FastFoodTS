name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint                  # eslint — на бэкенде его нет
      - run: npm run build                 # tsc -b + vite build
      - run: npm test                      # vitest run: 18 тестов